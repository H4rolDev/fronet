<main class="chat"><div class="chat-head"><span class="eyebrow">Asistencia</span><h1>Habla con Yani</h1><p>Te ayudo a encontrar una torta o a enviar una idea personalizada.</p></div><section class="messages"><div *ngFor="let message of messages" [class.user]="message.from === 'user'">{{ message.text }}<button *ngIf="message.action" class="custom-link" (click)="openCustomRequest()">Enviar mi diseño personalizado →</button></div></section><form (ngSubmit)="send()"><input name="message" [(ngModel)]="input" placeholder="¿Qué torta estás buscando?"><button class="primary">Enviar</button></form><a routerLink="/personalizado">Solicitar un diseño personalizado</a> · <a routerLink="/products">Ir al catálogo</a></main>
