<main class="chat"><div class="chat-head"><span class="eyebrow">Asistencia</span><h1>Habla con Yani</h1></div><section class="messages"><div *ngFor="let message of messages" [class.user]="message.from === 'user'">{{ message.text }}</div></section><form (ngSubmit)="send()"><input name="message" [(ngModel)]="input" placeholder="¿Qué torta estás buscando?"><button class="primary">Enviar</button></form><a routerLink="/products">Ir al catálogo</a></main>
